<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waterworks — Interactive Wireframe</title>
  <meta name="description" content="Interactive wireframe for Waterworks, a small-city water-system builder. Prototype with mock data.">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/map.css">
</head>
<body>
<div id="startShell" class="start-shell" aria-live="polite">
  <div class="start-panel">
    <div class="start-art" aria-hidden="true"></div>
    <div class="start-copy">
      <p class="kicker">Chapter 1 · Alpine Headwaters</p>
      <h1>Waterworks</h1>
      <p class="lead">Follow water from the mountains to the community — and back again.</p>
      <div class="start-actions">
        <button type="button" class="btn primary" data-act="start-journey">Start Journey</button>
        <button type="button" class="btn" data-act="continue-journey" id="continueJourneyBtn">Continue</button>
        <button type="button" class="btn" data-act="explore-environments">Explore environments</button>
        <button type="button" class="btn" data-act="open-settings-shell">Settings</button>
      </div>
    </div>
  </div>
</div>

<div id="tutorialOverlay" class="tutorial-overlay hidden" aria-live="polite" aria-modal="true" role="dialog">
  <div class="tutorial-panel">
    <div class="tutorial-header">
      <p class="kicker">Guided trail</p>
      <button type="button" class="icon-btn" data-act="close-tutorial" aria-label="Close tutorial">×</button>
    </div>
    <div class="tutorial-body">
      <h2 id="tutorialTitle">Follow the water</h2>
      <p id="tutorialMessage">Water must pass through treatment before the community can use it safely. Select the treatment plant to see what changes.</p>
    </div>
    <div class="tutorial-actions">
      <button type="button" class="btn" data-act="tutorial-back">Back</button>
      <button type="button" class="btn" data-act="tutorial-skip">Skip tutorial</button>
      <button type="button" class="btn primary" data-act="tutorial-next">Next</button>
    </div>
  </div>
</div>

<a class="skip" href="#stage">Skip to the map</a>

<div class="app" id="app" data-rail="open" data-dash="open">

  <!-- 1 TOP COMMAND BAR -->
  <header class="topbar on-dark" role="banner">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg class="ic"><use href="#i-drop"/></svg></span>
      <div class="brand-text">
        <h1>Waterworks</h1>
        <p class="scenario" id="scenarioName"></p>
      </div>
    </div>

    <div class="daybox" role="group" aria-label="Current day">
      <span class="lbl">Day</span><strong id="dayNum">4</strong>
      <span class="streak" id="streak"></span>
      <div class="daybar" aria-hidden="true"><i id="dayFill"></i></div>
    </div>

    <div id="chapterBanner" class="chapter-banner" hidden aria-live="polite"></div>

    <div class="time" role="group" aria-label="Time controls">
      <button type="button" class="tbtn" data-speed="pause" aria-pressed="true" aria-label="Pause" data-tip="Pause"><svg class="ic"><use href="#i-pause"/></svg></button>
      <button type="button" class="tbtn" data-speed="normal" aria-pressed="false" aria-label="Normal speed" data-tip="Normal speed: one day in about 60 seconds"><svg class="ic"><use href="#i-play"/></svg></button>
      <button type="button" class="tbtn" data-speed="fast" aria-pressed="false" aria-label="Fast" data-tip="Fast: one day in about 20 seconds"><svg class="ic"><use href="#i-fast"/></svg></button>
    </div>

    <ul class="stats" aria-label="Resources">
      <li id="statFunding"></li>
      <li id="statEnergy"></li>
      <li id="statKnowledge"></li>
    </ul>

    <div class="people" id="statPeople"></div>

    <div class="tools">
      <button type="button" class="tool" id="btnAbout" aria-label="About and science"><svg class="ic"><use href="#i-book"/></svg><span>Science</span></button>
      <button type="button" class="tool" id="btnHelp" aria-label="Help"><svg class="ic"><use href="#i-help"/></svg><span>Help</span></button>
      <button type="button" class="tool" id="btnSettings" aria-label="Settings"><svg class="ic"><use href="#i-gear"/></svg><span>Settings</span></button>
    </div>
  </header>

  <div class="workspace" id="workspace">
    <!-- 2 LEFT PLANNING RAIL -->
    <nav class="rail on-dark" id="rail" aria-label="Planning rail"><div class="rail-inner" id="railInner"></div></nav>

    <!-- 3 CENTRAL MAP -->
    <main class="stage" id="stage" tabindex="-1" aria-label="Community map">
      <div class="loopbar" id="loopbar" role="group" aria-label="Daily loop: observe, test, allocate, build, run the day, see consequences, adapt"></div>
      <div class="mapwrap">
        <div class="mapstage" id="mapstage"></div>
        <div class="weatherbox" id="weatherbox"></div>
        <div class="layers" id="maptools" role="group" aria-label="Map layers"></div>
        <div id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
        <div class="journey" id="journey" role="group" aria-label="Follow the water: click a step to inspect it"></div>
      </div>
    </main>

    <!-- 4 RIGHT INSPECTION PANEL -->
    <aside class="inspector" id="inspector" aria-label="Inspection panel" tabindex="-1"></aside>

    <!-- 6 DAILY ALLOCATION DRAWER -->
    <section class="drawer" id="allocDrawer" hidden aria-labelledby="allocTitle" tabindex="-1"></section>
  </div>

  <!-- 5 BOTTOM SYSTEM DASHBOARD -->
  <section class="dashboard" id="dashboard" aria-label="System dashboard"></section>
</div>

<dialog id="dlgEvent" class="dlg dlg-event" aria-labelledby="evTitle"></dialog>
<dialog id="dlgSummary" class="dlg dlg-summary" aria-labelledby="sumTitle"></dialog>
<dialog id="dlgSecurity" class="dlg dlg-narrow" aria-labelledby="secTitle"></dialog>
<dialog id="dlgAbout" class="dlg" aria-labelledby="aboutTitle"></dialog>
<dialog id="dlgHelp" class="dlg" aria-labelledby="helpTitle"></dialog>
<dialog id="dlgSettings" class="dlg dlg-narrow" aria-labelledby="setTitle"></dialog>
<dialog id="dlgRoutines" class="dlg" aria-labelledby="routTitle"></dialog>
<dialog id="dlgWatch" class="dlg dlg-narrow" aria-labelledby="watchTitle"></dialog>
<dialog id="dlgChapterComplete" class="dlg dlg-summary" aria-labelledby="chapterCompleteTitle"></dialog>

<div id="tooltip" role="tooltip" hidden></div>
<div id="announcer" class="sr-only" role="status" aria-live="polite"></div>

<script src="js/mock-data.js"></script>
<script src="js/sim.js"></script>
<script src="js/map.js"></script>
<script src="js/views.js"></script>
<script src="js/views-dialogs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
