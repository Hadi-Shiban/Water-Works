<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Waterworks</title>
  <meta name="description" content="Waterworks: an illustrated village water-project game. A student project created in collaboration with charity: water.">
  <meta name="theme-color" content="#17191c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M6 7.5h12v13a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 20.5z' fill='%23f2c118' stroke='%236a4f00'/%3E%3Cpath d='M8 7.5c0-3 3-4.5 5-4.5M13.5 3h3v4.5' fill='none' stroke='%236a4f00' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/village.css">
</head>
<body>

<!-- Icon sprite: original 24px line icons, stroke = currentColor -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-can" viewBox="0 0 24 24"><path d="M6 7.5h12v13a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 20.5z" fill="#f2c118" stroke="#6a4f00"/><path d="M9 11l6 7M15 11l-6 7" stroke="#b68900"/><path d="M8 7.5c0-3 3-4.5 5-4.5M13.5 3h3v4.5" stroke="#6a4f00"/></symbol>
    <symbol id="i-wood" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><circle cx="16" cy="15" r="4"/><circle cx="12" cy="8" r="4"/><circle cx="8" cy="15" r="1.2"/><circle cx="16" cy="15" r="1.2"/><circle cx="12" cy="8" r="1.2"/></symbol>
    <symbol id="i-stone" viewBox="0 0 24 24"><path d="M3 19c-.5-4 2-7 6-7.5 3.5-.3 5 3 5 7.5zM11 19c0-5 2.5-8.5 6-8.5s4.5 3.5 4 8.5zM6.5 11.5C7 8 9 6 11.5 6.5s3 3 2 5"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 5.5a3 3 0 0 1 0 5.5M18 14c2 .7 3 2.8 3 6"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8 12.5l3 3 5-6"/></symbol>
    <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4M6 4.5h11l-2.5 4 2.5 4H6"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-6.5 10-6.5S22 12 22 12s-4 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 10a1 1 0 0 0 1 2h12a1 1 0 0 0 1-2l-5-10V3M7.5 15h9"/></symbol>
    <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2"/><path d="M10 21l2-6-2.5-2.5L11 8l3 3 3 1M9.5 12.5L7 15M14 15l2 6"/></symbol>
    <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0 5 5L10 21l-4-4zM14.5 6.5L17 4"/></symbol>
    <symbol id="i-hammer" viewBox="0 0 24 24"><path d="M14 5l5 5-2 2-5-5zM12.5 8.5L4 17l3 3 8.5-8.5"/></symbol>
    <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-chev-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
    <symbol id="i-chev-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  </defs>
</svg>

<!-- START SCREEN -->
<section id="start" class="start" aria-labelledby="startTitle">
  <div class="start-art" aria-hidden="true"></div>
  <div class="start-panel">
    <p class="kicker"><svg class="ic" aria-hidden="true"><use href="#i-can"/></svg> A village water-project game</p>
    <h1 id="startTitle">Waterworks</h1>
    <p class="tagline">Water changes what is possible.</p>
    <p class="lead">Work with a village water committee and its local partners to find, build and keep a water system running.</p>

    <div id="startActions" class="start-actions">
      <button type="button" class="btn primary big" data-act="start-game">Start Game</button>
      <button type="button" class="btn big" data-act="continue-game" id="continueBtn" hidden>Continue</button>
      <button type="button" class="btn ghost" data-act="start-menu">Settings &amp; about</button>
    </div>

    <form id="nameForm" class="name-form" hidden novalidate>
      <label for="villageName">Name your village</label>
      <div class="name-row">
        <input id="villageName" name="village" type="text" maxlength="24" autocomplete="off" spellcheck="false" placeholder="e.g. Kesi Hill" aria-describedby="nameHint nameError" required>
        <button type="button" class="btn" data-act="suggest-name">Suggest</button>
      </div>
      <p id="nameHint" class="hint">A fictional name. The landscape is chosen for you.</p>
      <p id="nameError" class="error" role="alert"></p>
      <div class="start-actions">
        <button type="submit" class="btn primary big">Found the village</button>
        <button type="button" class="btn ghost" data-act="cancel-name">Back</button>
      </div>
    </form>

    <p id="disclaimerStart" class="disclaimer"></p>
  </div>
</section>

<!-- GAME -->
<main id="game" class="game" hidden>
  <div id="stage" class="stage" aria-label="Village map"></div>

  <header class="hud">
    <div id="hudId" class="hud-card hud-id"></div>
    <button type="button" id="hudObjective" class="hud-card objective" data-act="open-checklist" aria-controls="checklist" aria-expanded="false" title="Show the project checklist"></button>
    <ul id="hudStats" class="hud-card hud-stats" aria-label="Village status and resources"></ul>
  </header>

  <section id="checklist" class="hud-card checklist" aria-label="Project checklist"></section>
  <aside id="sheet" class="hud-card sheet" aria-labelledby="sheetTitle" hidden></aside>
  <div id="guide" class="hud-card guide" role="note" hidden></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <p class="footnote">A student collaboration with charity: water</p>
</main>

<dialog id="dlg" class="dlg" aria-labelledby="dlgTitle"></dialog>
<div id="announcer" class="sr-only" role="status" aria-live="polite"></div>

<script src="js/village/data.js"></script>
<script src="js/village/sim.js"></script>
<script src="js/village/audio.js"></script>
<script src="js/village/scene.js"></script>
<script src="js/village/dev.js"></script>
<script src="js/village/ui.js"></script>
<script src="js/village/app.js"></script>
</body>
</html>
